name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, to notice when a new release of a dependency breaks the tests (the Overleaf image is pinned)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  unit:
    # Bounded, so a regression that hangs (e.g. the real-time reconnect loop) fails instead of running for hours
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: 'pip install --only-binary :all: build twine'
      - run: python -m build
      - run: twine check --strict dist/*

  integration:
    # Runs the integration tests against a local Overleaf Community Edition (tests/integration/compose.yml)
    # ubuntu-22.04 (kernel 6.8), not -latest: MongoDB 8 (Overleaf's minimum) exits on start on kernels 6.19 to
    # 7.0.13 (SERVER-121912), and ubuntu-24.04 runs 7.0.0-azure since 2026-10-25. Ubuntu keeps reporting 7.0.0 even
    # with upstream fixes, so MongoDB's check rejects it regardless; move back once SERVER-136848 is fixed.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: System libraries for Qt WebEngine (the login window test runs Qt offscreen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libnss3 libasound2 \
            libxcomposite1 libxdamage1 libxrandr2 libxkbfile1 libxshmfence1 libgbm1 libxtst6 > /dev/null
      - run: pip install -e ".[dev,gui]"
      - name: Start Overleaf Community Edition
        run: docker compose -f tests/integration/compose.yml up -d --wait --wait-timeout 900
      - run: pytest -m integration -v --keep-ce
      - name: Container logs on failure
        if: failure()
        run: docker compose -f tests/integration/compose.yml logs --tail 200
