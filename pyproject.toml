[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "overleaf-sync"
authors = [{ name = "Moritz Glöckl", email = "moritzgloeckl@users.noreply.github.com" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
keywords = ["overleaf", "sync", "latex", "tex"]
requires-python = ">=3.11"
dynamic = ["version", "description"]
dependencies = [
    "requests >=2.31,<3",
    "beautifulsoup4 >=4.12,<5",
    "yaspin >=3,<4",
    "click >=8.1,<9",
]

[project.optional-dependencies]
gui = ["PySide6 >=6.5,<7"]
dev = ["pytest >=8", "pytest-cov >=5", "responses >=0.25", "ruff >=0.6"]

[project.urls]
Homepage = "https://github.com/moritzgloeckl/overleaf-sync"
Issues = "https://github.com/moritzgloeckl/overleaf-sync/issues"

[project.scripts]
ols = "olsync.olsync:main"
overleaf-sync = "olsync.olsync:main"

[tool.flit.module]
name = "olsync"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not smoke'"
filterwarnings = ["ignore:color, on_color and attrs are not supported:UserWarning:yaspin"]
markers = [
    "integration: needs the Overleaf Community Edition container (tests/integration/compose.yml)",
    "smoke: runs against overleaf.com with a real session, local only (see tests/smoke/)",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"olsync/olbrowserlogin.py" = ["F403", "F405"]
